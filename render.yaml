services:
  - type: web
    name: civicpulse-backend
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: DATABASE_URL
        value: "sqlite:///./data/civicpulse.db"
